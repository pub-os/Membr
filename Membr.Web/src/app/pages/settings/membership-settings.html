@if (error()) {
  <z-alert zType="destructive" [zTitle]="error()" class="m-4" />
}
@if (successMessage()) {
  <z-alert [zTitle]="successMessage()" class="m-4" />
}

<div z-card class="m-4">
  <div z-card-header>
    <div z-card-title zTitle="Membership Settings"></div>
    <div z-card-description zDescription="Global rules that apply across all members."></div>
  </div>

  <div z-card-content>
    @if (loading()) {
      <p class="text-muted-foreground py-4 text-center text-sm">Loading...</p>
    } @else {
      <div class="flex items-center gap-2">
        <input id="allowMultiple" type="checkbox" [(ngModel)]="allowMultipleMemberships" class="h-4 w-4" />
        <label for="allowMultiple" class="text-sm font-medium">Allow members to hold multiple memberships at once</label>
      </div>
      <p class="text-muted-foreground mt-1 text-sm">
        When off, a member must let their current membership expire before a new one can be added.
      </p>
    }
  </div>

  <div z-card-footer>
    <button z-button [zLoading]="saving()" [disabled]="loading() || saving()" (click)="save()">
      Save
    </button>
  </div>
</div>
