<div class="flex min-h-screen items-center justify-center p-4">
  <z-card class="w-full max-w-sm">
    <div z-card-header>
      <div class="flex flex-col items-center gap-1 text-center">
        <div class="mb-4 flex items-center justify-center gap-2">
          <img src="brand/membr-mark-colour.svg" alt="" class="size-8 shrink-0" width="32" height="32" />
          <span class="text-xl font-semibold">Memb<span class="text-primary">r</span></span>
        </div>

        <div z-card-description zDescription="Please sign in to continue."></div>
      </div>
    </div>

    <div z-card-content>
      <form (ngSubmit)="submit()" class="grid gap-4">
        <div class="grid gap-2">
          <label for="email" class="text-sm font-medium">Email</label>
          <input
            z-input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
            [(ngModel)]="email"
          />
        </div>

        <div class="grid gap-2">
          <label for="password" class="text-sm font-medium">Password</label>
          <input
            z-input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
            [(ngModel)]="password"
          />
        </div>

        @if (error()) {
          <z-alert zType="destructive" [zDescription]="error()!" />
        }

        <button z-button type="submit" class="w-full" [zLoading]="loading()" [zDisabled]="loading()">
          {{ loading() ? 'Signing in…' : 'Sign in' }}
        </button>
      </form>
    </div>
  </z-card>
</div>
